name: DeenRev Kernel Build

on:
  push:
    branches:
      - bakasu-susfs23-deen
  workflow_dispatch:
    inputs:
      build_zip:
        description: Package Image.gz-dtb with SHANDZIN AnyKernel3
        type: boolean
        required: true
        default: true
      ksu_ref:
        description: BakaSU commit, tag or branch
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deen-kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: bakasu-susfs23-deen
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates curl flex git libelf-dev libssl-dev lld make pahole perl python3 python-is-python3 zip unzip jq cpio rsync

      - name: Verify kernel, SUSFS patches, and build script
        run: |
          set -euo pipefail
          grep -qx 'VERSION = 4' Makefile
          grep -qx 'PATCHLEVEL = 19' Makefile
          grep -qx 'SUBLEVEL = 325' Makefile
          test -f arch/arm64/configs/vendor/deen_defconfig
          test -s patches/susfs-v2.3.0-4.19.patch
          test -s patches/bakasu-susfs-v2.3.0-inline-hooks.patch
          test -s patches/susfs-v2.3.0.config
          bash -n build.sh
          test -z "$(grep -n -- '-d KSU_SUSFS' build.sh || true)"
          echo "Source commit: $(git rev-parse HEAD)"
          echo "Target: Linux 4.19.325 / Motorola Deen"

      - name: Resolve BakaSU revision
        id: resolve_bakasu
        env:
          KSU_REF_INPUT: ${{ inputs.ksu_ref || 'main' }}
        run: |
          set -euo pipefail
          git ls-remote https://github.com/Baka-SU/BakaSU.git "refs/heads/${KSU_REF_INPUT}" "refs/tags/${KSU_REF_INPUT}" "${KSU_REF_INPUT}" > /tmp/ksu-refs.txt
          KSU_SHA="$(awk 'NR==1 {print $1}' /tmp/ksu-refs.txt)"
          if [ -z "$KSU_SHA" ]; then
            echo "Could not resolve BakaSU ref: ${KSU_REF_INPUT}"
            cat /tmp/ksu-refs.txt
            exit 1
          fi
          echo "sha=$KSU_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved BakaSU revision: $KSU_SHA"

      - name: Build BakaSU + SUSFS 2.3.0 kernel and flashable ZIP
        env:
          KSU_DIR: ${{ runner.temp }}/bakasu
          KSU_REF: ${{ steps.resolve_bakasu.outputs.sha }}
          TOOLCHAIN_DIR: ${{ runner.temp }}/clang
        run: |
          set -euo pipefail
          chmod +x build.sh
          printf 'n\n' | ./build.sh deen -ksu -z

      - name: Export kernel headers for Android ROM integration
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCFLAGS=-fcommon \
            INSTALL_HDR_PATH="$PWD/out/arch/arm64/boot/usr" headers_install
          test -d out/arch/arm64/boot/usr/include
          test -s out/arch/arm64/boot/usr/include/linux/version.h || \
            test -s out/arch/arm64/boot/usr/include/linux/types.h
          echo "Exported UAPI headers to out/arch/arm64/boot/usr"

      - name: Verify artifacts and active SUSFS config
        env:
          BAKASU_SHA: ${{ steps.resolve_bakasu.outputs.sha }}
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          test -s out/.config
          test -s fs/nomount/nomount.c
          grep -q '^config NOMOUNT
 fs/nomount/Kconfig
          grep -q '#define NOMOUNT_BASE_VERSION "22"' fs/nomount/nomount.h
          grep -qx 'CONFIG_KEYS=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MAP=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' out/.config
          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          cp out/.config susfs-used.config
          printf 'kernel_version=4.19.325\nkernel_source_commit=%s\nbakasu_commit=%s\nsusfs_version=v2.3.0\nnomount_version=22\n' "$(git rev-parse HEAD)" "$BAKASU_SHA" > kernel-build-metadata.txt
          sha256sum out/arch/arm64/boot/Image.gz-dtb
          shopt -s nullglob
          zips=(DeenRev-deen-KSU-*.zip)
          test "${#zips[@]}" -gt 0
          sha256sum "${zips[@]}"

      - name: Upload kernel, config, checksums, and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Stable artifact name lets the LineageOS workflow fetch the latest
          # successful kernel build through a public artifact mirror.
          name: deen-susfs23
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
            out/arch/arm64/boot/usr/**
            include/linux/susfs.h
            fs/nomount/nomount.h
            susfs-used.config
            kernel-build-metadata.txt
            build_log.txt
            DeenRev-deen-KSU-*.zip
